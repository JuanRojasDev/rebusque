<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rebusque">
  <title>Rebusque</title>
  <!-- Placa informativa azul con filete blanco, como las señales viales colombianas -->
  <rect x="16" y="16" width="480" height="480" rx="72" fill="#0b4fa3"/>
  <rect x="44" y="44" width="424" height="424" rx="50" fill="none" stroke="#ffffff" stroke-width="16"/>
  <!-- Esquina preventiva amarilla con borde negro -->
  <path d="M468 300 L468 418 Q468 468 418 468 L300 468 Z" fill="#f6c400" stroke="#0e0f12" stroke-width="10" stroke-linejoin="round"/>
  <!-- La R: trazo grueso, terminales redondeadas -->
  <path d="M168 380 V132 H262 A70 70 0 0 1 262 272 H206 L318 380" fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
