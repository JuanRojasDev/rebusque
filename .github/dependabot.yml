version: 2
updates:
  # Mantiene al día las acciones fijadas por commit
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      acciones:
        patterns: ['*']

  # Dependencias del juego (solo versiones con al menos 2 semanas publicadas)
  - package-ecosystem: npm
    directory: /juego-web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dependencias:
        patterns: ['*']
